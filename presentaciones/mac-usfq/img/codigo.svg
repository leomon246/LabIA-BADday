<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1036"/><stop offset="1" stop-color="#0C0718"/></linearGradient><radialGradient id="glow" cx="0.8" cy="0.1" r="0.8"><stop offset="0" stop-color="#FF4FD8" stop-opacity="0.22"/><stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/></radialGradient></defs><rect width="480" height="420" fill="url(#bg)"/><rect width="480" height="420" fill="url(#glow)"/><rect x="20" y="24" width="440" height="372" rx="16" fill="#0C0718" stroke="#3CF0FF" stroke-opacity=".5" stroke-width="2"/><rect x="20" y="24" width="440" height="40" rx="16" fill="#241542"/><rect x="20" y="48" width="440" height="16" fill="#241542"/><circle cx="46" cy="44" r="7" fill="#FF5F57"/><circle cx="68" cy="44" r="7" fill="#FEBC2E"/><circle cx="90" cy="44" r="7" fill="#28C840"/><text x="250" y="50" font-size="16" fill="#A99BC9" font-weight="400" text-anchor="middle" font-family="Consolas, 'Roboto Mono', monospace">busqueda.cpp</text><text x="44" y="96" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">1</text><text x="56" y="96" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#7E6FA8">// búsqueda binaria: O(log n)</tspan></text><text x="44" y="123" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">2</text><text x="56" y="123" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">int </tspan><tspan fill="#3CF0FF">buscar</tspan><tspan fill="#F3EBFF">(vector&lt;</tspan><tspan fill="#FF4FD8">int</tspan><tspan fill="#F3EBFF">&gt;&amp; v, </tspan><tspan fill="#FF4FD8">int</tspan><tspan fill="#F3EBFF"> x) {</tspan></text><text x="44" y="150" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">3</text><text x="56" y="150" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">  int </tspan><tspan fill="#F3EBFF">lo = </tspan><tspan fill="#FFD166">0</tspan><tspan fill="#F3EBFF">, hi = v.</tspan><tspan fill="#3CF0FF">size</tspan><tspan fill="#F3EBFF">() - </tspan><tspan fill="#FFD166">1</tspan><tspan fill="#F3EBFF">;</tspan></text><text x="44" y="177" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">4</text><text x="56" y="177" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">  while </tspan><tspan fill="#F3EBFF">(lo &lt;= hi) {</tspan></text><text x="44" y="204" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">5</text><text x="56" y="204" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">    int </tspan><tspan fill="#F3EBFF">m = (lo + hi) / </tspan><tspan fill="#FFD166">2</tspan><tspan fill="#F3EBFF">;</tspan></text><text x="44" y="231" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">6</text><text x="56" y="231" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">    if </tspan><tspan fill="#F3EBFF">(v[m] == x) </tspan><tspan fill="#FF4FD8">return </tspan><tspan fill="#F3EBFF">m;</tspan></text><text x="44" y="258" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">7</text><text x="56" y="258" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">    if </tspan><tspan fill="#F3EBFF">(v[m] &lt; x) lo = m + </tspan><tspan fill="#FFD166">1</tspan><tspan fill="#F3EBFF">;</tspan></text><text x="44" y="285" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">8</text><text x="56" y="285" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">    else </tspan><tspan fill="#F3EBFF">hi = m - </tspan><tspan fill="#FFD166">1</tspan><tspan fill="#F3EBFF">;</tspan></text><text x="44" y="312" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">9</text><text x="56" y="312" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#F3EBFF">  }</tspan></text><text x="44" y="339" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">10</text><text x="56" y="339" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#FF4FD8">  return </tspan><tspan fill="#F3EBFF">-</tspan><tspan fill="#FFD166">1</tspan><tspan fill="#F3EBFF">;</tspan></text><text x="44" y="366" font-size="14" fill="#5B4C8A" font-weight="400" text-anchor="end" font-family="Consolas, 'Roboto Mono', monospace">11</text><text x="56" y="366" font-size="15.5" font-family="Consolas, 'Roboto Mono', monospace" xml:space="preserve"><tspan fill="#F3EBFF">}</tspan></text><rect x="56" y="374" width="9" height="18" fill="#3CF0FF"/></svg>